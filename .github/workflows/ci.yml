name: Continuous Delivery

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - '**'

jobs:
  test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal
    outputs:
      dotnet_version: ${{ steps.dotnet.outputs.dotnet-version }}

  release:
    name: Create Release
    uses: Fresa/Library.Net.ContinuousDelivery/.github/workflows/release.yml@v1
    needs: test
    if: github.repository == 'Fresa/NuGetAzCredentialsProvider' && github.actor != 'dependabot[bot]'
    permissions:
      # Create release and tags
      contents: write
    with:
      project_path: src/NuGetAzCredentialsProvider
      project_name: NuGetAzCredentialsProvider
      dotnet_version: ${{ needs.test.outputs.dotnet_version }}
      include_github_release_notes: true
    secrets:
      nuget_api_key: ${{ secrets.NUGET_API_KEY }}